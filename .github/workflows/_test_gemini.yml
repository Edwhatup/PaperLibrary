# EPHEMERAL test workflow — triggers on push to the dev branch so we can verify
# the Gemini long-form path end-to-end without workflow_dispatch permission.
# Delete after verification. (re-run 2: model fallback chain)
name: _test gemini

on:
  push:
    branches: [claude/paper-library-tts-ub68qn]
    paths: [".github/workflows/_test_gemini.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DIGEST_LANG: zh
      LLM_BACKEND: auto
      MAX_PAPERS: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE }}
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install -r requirements.txt
          if [ -n "$GEMINI_API_KEY" ]; then pip install google-generativeai; fi
      - name: Show key presence (masked)
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY is set (len ${#GEMINI_API_KEY})"; else echo "GEMINI_API_KEY EMPTY"; fi
      - name: Build 1 paper (2026-06-25) via Gemini
        run: python scripts/run_daily.py 2026-06-25
      - name: Inspect generated script
        run: |
          for f in data/scripts/2026-06-25-*.txt; do
            echo "===== $f ($(wc -m < "$f") chars) ====="
            head -c 800 "$f"; echo; echo "..."
          done
      - name: Sync to gdrive (so you can hear it in VLC)
        if: ${{ vars.RCLONE_REMOTE != '' }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone copy public "$RCLONE_REMOTE" --include "audio/**" --include "playlist.m3u8"
