# One-off: generate the same 导读 with several Anthropic models for a blind
# quality comparison (data/experiments/). Delete after the experiment.
name: _experiment model quality

on:
  push:
    branches: [claude/paper-library-tts-ub68qn]
    paths: [".github/workflows/_experiment.yml", "scripts/experiment_model_quality.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exp:
    runs-on: ubuntu-latest
    env:
      DIGEST_LANG: zh
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (lean — no TTS/STT needed)
        run: pip install requests pypdf anthropic
      - name: Generate variants
        run: python scripts/experiment_model_quality.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/experiments
          git diff --cached --quiet && exit 0
          git commit -m "exp: model-quality digest variants"
          git pull --rebase origin ${{ github.ref_name }}
          git push
