name: Daily Paper Radio

on:
  schedule:
    - cron: "0 23 * * *"   # 07:00 Beijing time (UTC+8)
  workflow_dispatch:
    inputs:
      date:
        description: "Date to build (YYYY-MM-DD, default = today UTC)"
        required: false
      max:
        description: "Max papers this run (overrides MAX_PAPERS; e.g. 1 for a cheap test)"
        required: false

permissions:
  contents: write   # commit audio/feed back to the repo
  pages: write      # deploy to GitHub Pages
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DIGEST_LANG: ${{ vars.DIGEST_LANG || 'zh' }}
      # "auto" picks gemini/anthropic by whichever key secret is set.
      # anthropic (Sonnet 4.6) primary; make_script falls back to Gemini on failure.
      LLM_BACKEND: ${{ vars.LLM_BACKEND || 'anthropic' }}
      MAX_PAPERS: ${{ github.event.inputs.max || vars.MAX_PAPERS || '5' }}
      # Where `public/` is served (GitHub Pages). Absolute URLs in rss.xml /
      # playlist.m3u8 come from this, so VLC / podcast apps can stream them.
      FEED_BASE_URL: ${{ vars.FEED_BASE_URL || 'https://edwhatup.github.io/PaperLibrary' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1
      - name: Install deps
        run: |
          pip install -r requirements.txt
          # Install whichever LLM SDK matches the key that's present.
          if [ -n "$GEMINI_API_KEY" ] || [ "$LLM_BACKEND" = "gemini" ]; then pip install google-generativeai; fi
          if [ -n "$ANTHROPIC_API_KEY" ] || [ "$LLM_BACKEND" = "anthropic" ]; then pip install anthropic; fi

      - name: Build episodes
        run: python scripts/run_daily.py ${{ github.event.inputs.date }}

      # Self-healing: re-clean scripts + re-synthesize any episode whose audio
      # is stale (TTS settings changed) or truncated (duration check). Free —
      # edge-tts only, no LLM calls; no-op when everything already matches.
      - name: Refresh existing audio
        run: python scripts/resynth.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public library
          git diff --cached --quiet || git commit -m "chore: daily papers $(date -u +%F)"
          git push

      # Push audio + playlist to your private cloud folder so VLC on iPhone
      # sees new episodes automatically. Inactive until you set the
      # RCLONE_REMOTE variable (e.g. "dropbox:PaperRadio") and the RCLONE_CONF
      # secret (output of `rclone config show`). Recommended remote: Dropbox or
      # Google Drive (rclone's iCloud backend is experimental — avoid).
      - name: Sync to cloud drive (VLC)
        if: ${{ vars.RCLONE_REMOTE != '' }}
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone copy public "$RCLONE_REMOTE" \
            --include "audio/**" --include "playlist.m3u8" --progress

      # Deploy public/ to GitHub Pages directly (a token-push would NOT trigger
      # the standalone pages.yml, so we deploy here in the same job).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
